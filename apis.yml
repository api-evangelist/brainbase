name: Brainbase
description: >-
  Brainbase is a modern, end-to-end brand-licensing and intellectual-property
  management platform used by global licensing businesses to run their licensing,
  partnership and sponsorship programs from a single system of record. The product
  covers the full IP lifecycle — trademarks, patents, copyrights, licences, products
  and royalties — consolidating contract management, royalty calculation, sales-data
  reporting and contract-compliance workflows for brand owners, licensors and their
  partners. Founded in 2016 in Los Angeles by Nate Cavanaugh, Brainbase raised an
  $8M Series A in 2020 led by Bessemer Venture Partners and Nosara Capital, and was
  acquired by PYXiS Software Group (a division of Jonas Software) in 2022. The public
  marketing apex (www.brainbase.com) no longer resolves post-acquisition; the SaaS
  application remains live at app.brainbase.com and exposes a small public REST API
  (bearer/JWT) at api.brainbase.com with an auto-generated OpenAPI document at
  api.brainbase.com/docs. This profile was surfaced from the Bessemer Venture Partners
  portfolio and enriched by the API Evangelist pipeline from the live API surface.
